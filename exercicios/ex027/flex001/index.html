<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container {
            background-color: salmon;

            display: flex;
        }
        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            flex: auto;
        }

        /* 
        [P] = Padrão

        -- pai ---
        display: flex = deve ser colocado no container (pai)

        flex-direction:
            column; -- cima para baixo [P]
            column-reverse; -- baixo para cima
            row; -- esquerda para a direita [P]
            row-reverse; -- direita para a esquerda

        -- filho ---
        flex: auto = define a flexibilidade como automática
        */
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
    </div>
</body>
</html>
