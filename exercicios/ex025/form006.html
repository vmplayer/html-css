<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        p#aviso > strong {
            color: red;
            border: 2px solid red;
            padding: 1px 8px;
            border-radius: 8px;
        }

        p#aviso {
            color: red;
            font-size: large;
            font-weight: bolder;
        }

        p#mensagem-aviso {
            text-align: justify;
            max-width: 450px;
        }

        p#mensagem-aviso > strong {
            color: darkslateblue;
        }
    </style>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="off">
        <p>
            <label for="icor">Cor: </label>
            <input type="color" name="cor" id="icor" value="#843adf">
        </p>

        <p>
            <label for="inivel">Nível de satisfação: </label>
            <input type="range" name="nivel" id="inivel" min="1" max="5" value="2">
        </p>

        <p>
            <label for="ifoto">Foto de perfil: </label>
            <input type="file" name="foto" id="ifoto">
        </p>

        <!--
         Ao utilizar o envio de imagem, utilizar o método Post no formulário, assim o arquivo será enviado pelo inspecionar para o arquivo .php!
         No caso, usar POST para elementos que ultrapassem 3.000 bytes.
        -->

        <p>
            <input type="reset" value="Limpar">
            <input type="submit" value="Enviar">
        </p>
    </form>
    <p id="aviso"><strong>!</strong> Aviso!</p>
    <p id="mensagem-aviso">Ao clicar no botão "Enviar", o download de um arquivo <strong>.php</strong> será solicitado, no arquivo não há absolutamente nada além de uma mensagem solicitando o estudo da linguagem. Se possível, não baixar.</p>
</body>
</html>
