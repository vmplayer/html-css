<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 14</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
            width: 800px;
        }

        th, .totalbar {
            background-color: dimgrey;
            color: white;
            padding: 10px;
            border: 1px solid black;
            font-weight: bold;
        }

        td {
            border: 1px solid black;
            padding: 10px;
            background-color: white;
            color: black;
        }

        th.title {
            background-color: white;
            color: black;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th rowspan="2" scope="col">Área</th>
                <th rowspan="2" scope="col">Disciplinas</th>
                <th colspan="2" scope="colgroup">Notas</th>
                <th rowspan="2" scope="col">Notas</th>
            </tr>
            <tr>
                <th scope="col">1 Sem.</th>
                <th scope="col">2 Sem.</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4" scope="rowgroup" class="title">Exatas</th>
                <td>Matemática</td>
                <td>7.2</td>
                <td>5.4</td>
                <td>6.3</td>
            </tr>
            <tr>
                <td>Física</td>
                <td>4.1</td>
                <td>8.9</td>
                <td>6.5</td>
            </tr>
            <tr>
                <td>Química</td>
                <td>5.4</td>
                <td>9.4</td>
                <td>7.4</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td>6.3</td>
                <td>7.7</td>
                <td>7.0</td>
            </tr>
            <tr class="totalbar">
                <th colspan="4">Média de Exatas</th>
                <td class="totalbar">6.8</td>
            </tr>
            <tr>
                <th rowspan="2" class="title">Humanas</th>
                <td>História</td>
                <td>9.2</td>
                <td>8.6</td>
                <td>8.9</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td>7.8</td>
                <td>5.4</td>
                <td>6.7</td>
            </tr>
            <tr class="totalbar">
                <th colspan="4" scope="rowgroup">Média de Humanas</th>
                <td class="totalbar">7.8</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
