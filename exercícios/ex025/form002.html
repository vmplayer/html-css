<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        p#aviso > strong {
            color: red;
            border: 2px solid red;
            padding: 1px 8px;
            border-radius: 8px;
        }

        p#aviso {
            color: red;
            font-size: large;
            font-weight: bolder;
        }

        p#mensagem-aviso {
            text-align: justify;
            max-width: 450px;
        }

        p#mensagem-aviso > strong {
            color: darkslateblue;
        }
    </style>
</head>
<body>
    <h1>Teste de Formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="iusu">Usuário: </label>
            <input type="text" name="usu" id="iusu" required maxlength="15" size="15" placeholder="Máximo de 15 dígitos" autocomplete="username">
        </p>
        <p>
            <label for="isen">Senha: </label>
            <input type="password" name="sen" id="isen" required minlength="8" maxlength="16" size="17" placeholder="Mínimo de 8 letras" autocomplete="current-password">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
    <p id="aviso"><strong>!</strong> Aviso!</p>
    <p id="mensagem-aviso">Ao clicar no botão "Enviar", o download de um arquivo <strong>.php</strong> será solicitado, no arquivo não há absolutamente nada além de uma mensagem solicitando o estudo da linguagem. Se possível, não baixar.</p>
</body>
</html>
