<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: lightgray;
        }

        input {
            background-color: transparent;
            border-bottom: 1px solid black;
            border-top: none;
            border-left: none;
            border-right: none;
            transition: .2s;
        }

        input#submit {
            position: flex;
            padding: 5px 10px;
            background-color: white;
            border-radius: 5px;
            border: none;
            
        }

        input#submit:hover {
            background-color: rgb(137, 187, 204);
            outline: 1px solid black;
            transition: .2s;
        }

        input:focus {
            border-bottom: 1px solid blue;
            border-top: none;
            border-left: none;
            border-right: none;
            outline: none;
        }

        p#aviso > strong {
            font-family: serif;
            color: red;
            border: 2px solid red;
            padding: 1px 8px;
            border-radius: 8px;
        }

        p#aviso {
            font-family: serif;
            color: red;
            font-size: large;
            font-weight: bolder;
        }

        p#mensagem-aviso {
            font-family: serif;
            text-align: justify;
            max-width: 450px;
        }

        p#mensagem-aviso > strong {
            font-family: serif;
            color: darkslateblue;
        }
    </style>
</head>
<body>
    <h1>Meu primeiro formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="off">
        <!-- SEMPRE USAR LABEL FORMULÁRIOS!!! -->
        <p><label for="inome">Nome: </label>
            <input type="text" name="nome" id="inome"></p>
        <p><label for="isobrenome">Sobrenome: </label>
            <input type="text" name="sobrenome" id="isobrenome"></p>
        <p><input type="submit" value="Enviar" id="submit"></p>
    </form>
    <p id="aviso"><strong>!</strong> Aviso!</p>
    <p id="mensagem-aviso">Ao clicar no botão "Enviar", o download de um arquivo <strong>.php</strong> será solicitado, no arquivo não há absolutamente nada além de uma mensagem solicitando o estudo da linguagem. Se possível, não baixar.</p>
</body>
</html>
